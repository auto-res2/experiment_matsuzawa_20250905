experiments:
  - name: exp1_waterbirds
    dataset_name: waterbirds
    seed: 0
    latent_dims_keep: 10
    notears_lambda1: 0.01
    dro_radius: 0.2
    fourier_lambda: 0.2
    training:
      epochs: 200
      batch_size: 256
      lr: 0.0003
      weight_decay: 0.0001
    diffusion:
      lora_rank: 8
      lora_lr: 0.0001
      steps: 2000
      ddim_steps: 20
      cfg_scale: 7.5
