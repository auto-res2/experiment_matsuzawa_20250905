# config/config.yaml
# All hyper-parameters and constant paths for EXP-1 (Waterbirds).

device: "cuda"  # will be validated at runtime

# File system ----------------------------------------------------
data_root: "data"               # dataset cache
results_dir: ".research/iteration57"

# Dataset --------------------------------------------------------
dataset_repo: "grodino/waterbirds"

# Training -------------------------------------------------------
seeds: [0, 1, 2]
batch_size: 96
epochs: 15
lr: 1.0e-4
weight_decay: 5.0e-5

# PGD sanity check ----------------------------------------------
pgd_eps: 0.00784313725490196   # 2/255
pgd_steps: 20
