# config/config.yaml
# -----------------------------------------------------------------------------
# Minimal configuration file consumed by ``src.main``.  In a real research
# project we would place the full experiment grid here; for demonstration
# purposes – and to keep the CI runtime acceptable – only one configuration is
# executed.
# -----------------------------------------------------------------------------
experiments:
  - name: exp1
    dataset: cifar100
    backbone: resnet18
    method: LOSR        # choose from {LOSR, ER, DERPP, etc.}
    seed: 7
    lr: 0.001
    budget_kb: 32       # LOSR uses a fixed 32 kB budget
