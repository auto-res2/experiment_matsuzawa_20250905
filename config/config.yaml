# config/config.yaml – minimal yet functional parameters for the refactored demo

global:
  device: "cuda:0"
  data_root: "data"
  num_workers: 2
  seeds: [0]
  batch_size:
    exp1: 16
    exp2: 32
  optim:
    lr: 3e-4
    weight_decay: 1e-4
    betas: [0.9, 0.999]
    eps: 1e-8

models:
  sdxl_base: "stabilityai/stable-diffusion-2-base"  # only logged – not downloaded

# ---------------------------------------------------------------------------
#                            Dataset section
# ---------------------------------------------------------------------------

datasets:
  waterbirds:
    hf_repo: "dslim/waterbirds"           # public mirror (placeholder)
    split:
      train: "train"
      val: "val"
      test: "test"
  celeba:
    hf_repo: "nateraw/celeba-img-aligned-256"

# ---------------------------------------------------------------------------
#                           Experiment parameters
# ---------------------------------------------------------------------------

experiments:
  exp1:
    concept_k: 32
    cf_ratio: 0.05
    lambda_gc: 0.1
    lambda_wd: 1e-4
    epochs: 2
  exp2:
    concept_k: 16
    epochs_erm: 1
  exp3:
    placeholder: true  # skeleton only – see src.main
