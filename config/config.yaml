# Experiments.yaml – Experiments 1 & 3 consolidated
exp1:
  description: Depth-Stability Benchmark (corrected implementation)
  datasets: [Cora, PubMed, Chameleon, Texas, RingTransfer]
  backbones: [GCN]
  depths: [2, 8, 32, 64, 120]
  variants: [vanilla, pairnorm, dgn, psnr, curvada]
  seeds: [0, 1, 2]
  max_epochs: 400
  lr: 0.005
exp3:
  description: Large-Scale Efficiency (ogbn-products, 100-layer SGC)
  dataset: ogbn-products
  depths: [100]
  variants: [vanilla, curvada]
  seeds: [0]
  max_epochs: 40
  lr: 0.005
