shared:
  passes_per_task: 10
  batch_size: 128
  lr_grid: [0.001, 0.0005, 0.0002]
  seeds: [7, 17, 23, 31, 47]
  budget_kb: 32

experiments:
  - dataset: cifar100
    backbone: resnet18
    method: LOSR
  - dataset: cifar100
    backbone: resnet18
    method: ER
    buffer_kb: [32, 128, 512]
  - dataset: cifar100
    backbone: resnet18
    method: DERPP
    buffer_kb: [32, 128, 512]
  - dataset: cifar100
    backbone: resnet18
    method: AGEM
    buffer_kb: [32, 128, 512]
  - dataset: cifar100
    backbone: resnet18
    method: ORTHO_SUB
