# config/config.yaml ––– consolidated YAML configuration

# ---------------------------------------------------------------------------
# Global Training / Evaluation Settings
# ---------------------------------------------------------------------------
global:
  device: "cuda"  # switched to CPU automatically if unavailable
  num_workers: 4
  epochs: 1000
  early_stop_patience: 100
  log_every: 5
  seed: 42
  mixed_precision: false
  optim: {name: adam, lr: 0.005, weight_decay: 0.0005}
  scheduler: {name: plateau, factor: 0.5, patience: 50, min_lr: 0.00001}

# ---------------------------------------------------------------------------
# Experiment-specific configurations
# ---------------------------------------------------------------------------
experiments:
  exp_depth_scaling:
    description: |
      Depth-Scaling Benchmark comparing vanilla GCN, PairNorm, NDLS and the proposed DH-GNN
      across 5 datasets with nominal depths up to 64 layers (details in paper Section 4.1).
    datasets: [Cora, Pubmed, Chameleon, Actor, ogbn_arxiv]
    models:
      - {name: gcn, layers: [4, 8, 16, 32, 64]}
      - {name: gcn_pairnorm, layers: [4, 8, 16, 32, 64]}
      - {name: ndls, preset_depths: [2, 4, 6, 8, 10]}
      - {name: dhgnn, max_layers: 64}

  exp_robustness:
    description: |
      Robustness to 50 % feature masking (MF50), 10 % edge deletion (ED10) and combined noise on
      Pubmed & Chameleon comparing DropEdge, NDLS, GCNII and DH-GNN (Section 4.2).
    datasets: [Pubmed, Chameleon]
    models:
      - {name: gcn, layers: 32}
      - {name: gcn_dropedge, layers: 32, dropedge_p: 0.2}
      - {name: ndls, preset_depths: 6}
      - {name: gcnii, layers: 32}
      - {name: dhgnn, max_layers: 64}
    corruptions:
      - {type: feature_mask, ratio: 0.5}
      - {type: edge_del, ratio: 0.1}
      - {type: combined, feature_ratio: 0.5, edge_ratio: 0.1}

  exp_nodewise_halting:
    description: |
      Microscopic analysis of learned stopping depths τ(i) on ogbn-arxiv with DH-GNN wrapped
      around a 2-head GAT-v2 backbone (Section 4.3).
    datasets: [ogbn_arxiv]
    models:
      - {name: dhgnn_gat, max_layers: 32}
