experiments:
  - id: exp1
    description: "CIFAR-100 20×5 – Fidelity & Memory-Accuracy Pareto"
    seeds: [11, 17, 23]
    batch_size: 128
    epochs_per_task: 10
    optim:
      lr: 0.05
    dataset:
      name: cifar100
      num_tasks: 20
      classes_per_task: 5
      num_classes_total: 100
    methods:
      clove_sub:
        rank: 16
        buffer_bytes: 960000
        sparsity: 0.2
        lambda_vq: 0.1
        lambda_adapter: 0.1
      er_ring: {}
      ewc: {}
      sparcl: {}
      aqm: {}
