[project]
name = "losr_experiments"
version = "0.1.0"
requires-python = ">=3.9"
description = "Refactored continual-learning baseline & LOSR experiments"
license = {text = "MIT"}
authors = [
  {name = "Researcher", email = "research@openai.com"}
]

# Dependencies must be expressed as an *array* of requirement strings according
# to PEP 621. The previous table-style declaration was invalid and caused the
# TOML parser to fail.
dependencies = [
  "torch",
  "torchvision",
  "matplotlib",
  "seaborn",
  "scikit-learn",
  "pyyaml",
  "requests",
  "avalanche-lib"
]

[tool.setuptools.packages.find]
where = ["src"]
