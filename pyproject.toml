[project]
name = "curvonet-research"
version = "0.1.0"
description = "Research code for curvature-aware variance-preserving GNN (CURVONet)"
authors = [{ name = "Auto-generated by ChatGPT-4" }]
readme = "README.md"
requires-python = ">=3.10"

# --------------------------------------------------------------------------------------------
# Runtime dependencies (PEP-621): list style as required by the spec                          
# --------------------------------------------------------------------------------------------
dependencies = [
    "torch>=2.1,<2.3",          # core deep-learning framework (CUDA wheel resolved by pip)
    "torch-geometric",           # GNN library (binary wheels picked via extra index)
    "numpy>=1.23,<2.0",
    "matplotlib>=3.7,<4.0",
    "scikit-learn>=1.1,<1.3",
    "PyYAML>=6.0,<7.0",
]

# Optional / extra dependencies ---------------------------------------------------------------
[project.optional-dependencies]
flops = [
    "fvcore>=0.1.5",            # only needed for FLOP counting utilities
]
ogb = [
    "ogb>=1.3.6,<1.5.0",        # Open Graph Benchmark datasets loader
]

# --------------------------------------------------------------------------------------------
# Legacy Poetry metadata (retained for editors that still rely on it)                          
# --------------------------------------------------------------------------------------------
[tool.poetry]
name = "curvonet-research"
version = "0.1.0"
description = "Research code for curvature-aware variance-preserving GNN (CURVONet)"
authors = ["Auto-generated by ChatGPT-4"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
torch = "^2.1"
torch-geometric = "*"
numpy = "*"
matplotlib = "*"
scikit-learn = "*"
PyYAML = "*"
fvcore = { version = "*", optional = true }
ogb = { version = "*", optional = true }

[tool.poetry.extras]
flops = ["fvcore"]
ogb = ["ogb"]

# --------------------------------------------------------------------------------------------
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
