[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clove_sub"
version = "0.3.0"
description = "Compressed Latent Orthogonal-Subspace Replay (CLoVe-Sub) – research code-base"
authors = [
  { name = "Researcher", email = "research@example.com" }
]
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }

# -----------------------------------------------------------------------------
#  Core (runtime) dependencies – minimal list
# -----------------------------------------------------------------------------

dependencies = [
  "torch~=2.0",            # deep-learning framework
  "torchvision~=0.15",     # datasets & models
  "pyyaml>=6.0",           # config loader
]

[project.optional-dependencies]
extra = [
  "geoopt>=0.5",           # orthogonal manifold projector (optional but recommended)
  "pynvml>=11.4",          # energy logging (optional)
]

[tool.setuptools.package-dir]
# Source layout: only 'src' is a package root.
"" = "src"
