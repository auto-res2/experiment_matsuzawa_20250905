[project]
name = "losr_cl_experiments"
version = "0.2.1"
requires-python = ">=3.9"
description = "Latent-Orthogonal-Sketch-Replay – reproducibility package"
license = {text = "MIT"}
authors = [
  {name = "Cutting-edge-AI-researcher", email = "research@openai.com"}
]

# ---------------------------------------------------------------------------
# Runtime dependencies -------------------------------------------------------

# NOTE: The previous attempt to pin CUDA/CPU–specific build strings (e.g.
# "torch==2.1.2+cpu") led to an unsatisfiable environment on the CI runner.
# We instead rely on the default PyPI wheels which already include GPU (CUDA
# 12.x) support or fall back to CPU where no GPU is present.  Explicit "cu118"
# wheels can still be supplied externally via the extra index URL but are no
# longer hard-pinned here.

dependencies = [
  "torch>=2.1,<2.2",
  "torchvision>=0.16,<0.17",
  "matplotlib>=3.7,<4.0",
  "seaborn>=0.12,<0.13",
  "scikit-learn>=1.3,<2.0",
  "pyyaml>=6.0,<7.0",
  "requests>=2.31,<3.0",
  "tqdm>=4.66,<5.0",
  "ptflops>=0.7.4,<0.8",
  "pytest>=7.4,<8.0"
]

[tool.setuptools.packages.find]
where = ["src"]
