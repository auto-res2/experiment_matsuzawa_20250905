[project]
name = "curvada-experiments"
version = "0.1.0"
description = "CurvAdaNorm experimental suite (refactored)"
authors = [ {name = "ML Researcher"} ]
requires-python = ">=3.9"

# Core dependencies – order chosen to avoid circular / build issues
dependencies = [
    "torch",
    "torchvision",
    "torch-geometric",
    "torch-scatter",
    "torch-sparse",
    "torch-cluster",
    "torch-spline-conv",
    "networkx",
    "pyyaml",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "ogb",
    "GraphRicciCurvature",
]

[tool.setuptools.packages.find]
where = ["src"]
