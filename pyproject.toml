[tool.poetry]
name = "curvonet"
version = "0.1.0"
description = "Research codebase for CURVONet experiments"
authors = ["Researcher <research@example.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.9"
torch = "^2.0"
torch-geometric = "^2.4"
matplotlib = "^3.5"
pyyaml = "^6.0"
# Optional but recommended --------------------------------------------------
ogb = { version = "^1.3.6", optional = true }
fvcore = { version = "^0.1.5", optional = true }

[tool.poetry.extras]
full = ["ogb", "fvcore"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
