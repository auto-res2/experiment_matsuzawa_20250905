[project]
name = "losr_cl_experiments"
version = "0.2.0"
requires-python = ">=3.9"
description = "Latent-Orthogonal-Sketch-Replay – reproducibility package"
license = {text = "MIT"}
authors = [
  {name = "Cutting-edge-AI-researcher", email = "research@openai.com"}
]

# ---------------------------------------------------------------------------
# Runtime dependencies -------------------------------------------------------

dependencies = [
  "torch==2.1.2+cu118; platform_system!='Windows' and extra == 'cuda'",
  "torchvision==0.16.2+cu118; platform_system!='Windows' and extra == 'cuda'",
  "torch==2.1.2+cpu; platform_system=='Windows' or extra == 'cpu'",
  "torchvision==0.16.2+cpu; platform_system=='Windows' or extra == 'cpu'",
  "matplotlib>=3.7,<4.0",
  "seaborn>=0.12,<0.13",
  "scikit-learn>=1.3,<2.0",
  "pyyaml>=6.0,<7.0",
  "requests>=2.31,<3.0",
  "tqdm>=4.66,<5.0",
  "ptflops>=0.7.4,<0.8",
  "pytest>=7.4,<8.0"
]

[tool.setuptools.packages.find]
where = ["src"]
