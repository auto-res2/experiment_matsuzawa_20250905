[project]
name = "dfbd_project"
version = "0.1.0"
description = "Refactored Dynamic Few-Bit Distillation research code-base"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"

# -----------------------------------------------------------------------------
# PEP-621 compliant dependency specification (must be a sequence, not a table)
# -----------------------------------------------------------------------------

dependencies = [
  "torch>=2.1.0,<2.2.0",
  "torchvision>=0.16.0,<0.17.0",  # 0.16.x pairs with PyTorch 2.1.x
  "numpy",
  "matplotlib",
  "pyyaml",
  "tqdm"
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
