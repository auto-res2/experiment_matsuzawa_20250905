[project]
name = "clove_sub"
version = "0.2.0"
requires-python = ">=3.10,<3.12"

[project.dependencies]
torch = {version = ">=2.1.0,<2.3.0", extras=["cuda118"]}
torchvision = ">=0.16.0,<0.18.0"
timm = ">=0.9.5,<1.2.0"
geoopt = ">=0.6.0,<0.7.0"
numpy = ">=1.26,<2.4"
pandas = ">=2.1,<2.4"
matplotlib = "*"
PyYAML = "*"
torchmetrics = ">=1.3,<1.9"
pynvml = ">=11.5,<13.0"
torch-optimizer = ">=3.0.0,<4.0.0"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
