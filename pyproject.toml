[project]
name = "samp-experiments"
version = "0.1.0"
description = "Deep GNN over-smoothing study with Spectral Attention Message Passing (SAMP)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

# ---------------------------------------------------------------------------
# Dependencies – listed as an array per PEP 621 to satisfy TOML parsers
# ---------------------------------------------------------------------------
dependencies = [
  "torch>=1.13.1",
  "torch_geometric>=2.3.1",
  "ogb",
  "networkx",
  "scikit-learn",
  "matplotlib",
  "seaborn",
  "PyYAML",
  "ptflops",
]

[project.optional-dependencies]
extra = [
  "psutil",
]

[build-system]
requires = ["setuptools", "wheel"]
