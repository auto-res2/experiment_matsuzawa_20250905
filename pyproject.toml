[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waterbirds-cgsi-exp"
version = "0.1.0"
description = "Refactored project structure for the CGSI Waterbirds experiment."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  {name = "ML Researcher", email = "researcher@example.com"}
]

# ------------------------- Dependencies -------------------------
# The order below helps pip resolve wheels with minimum conflicts and avoids
# circular import issues inside the code base itself.

dependencies = [
  "torch>=2.0",
  "torchvision>=0.15",
  "timm>=0.9.0",
  "datasets>=2.14.0",
  "fvcore>=0.1.5.post20221221",
  "matplotlib>=3.6",
  "scikit-learn>=1.3",
  "numpy>=1.23",
  "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
