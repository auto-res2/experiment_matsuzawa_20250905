[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clove_sub"
version = "0.1.0"
description = "Compressed Latent Orthogonal-Subspace replay (CLoVe-Sub) continual-learning benchmark"
authors = [{ name = "Researcher", email = "author@example.com" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "timm>=0.9.5,<1.1",
    "geoopt>=0.5,<0.7",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "seaborn",
    "requests",
    "PyYAML",
]

[project.optional-dependencies]
cuda = [
    "pynvml; platform_system=='Linux' and extra=='cuda'",
]

# ----------------------------------------------------------------------
#  Setuptools configuration – explicit package discovery & data files
# ----------------------------------------------------------------------
[tool.setuptools]
# Tell setuptools that all Python packages live under the ``src``
# directory so that they are discovered correctly when building the
# wheel/editable installation.
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# Include YAML config files inside the final wheel (so that the code can
# locate them at run-time) irrespective of the exact module they live in.
[tool.setuptools.package-data]
"*" = ["config/*.yaml"]
