[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "afngnn-research"
version = "0.1.0"
description = "Adaptive Frequency-band Node-wise GNN experimental suite"
requires-python = ">=3.9"
authors = [{ name = "Researcher" }]

dependencies = [
    # Torch – pin to a version that has *binary wheels* for PyG extensions
    "torch==2.2.2",            # CPU wheel is enough; allows installing torch-sparse wheels
    # PyG core & compiled extensions (CPU wheels available for 2.2.*)
    "torch-geometric==2.5.2",
    "torch-scatter==2.1.2",
    "torch-sparse==0.6.18",
    "torch-cluster==1.6.3",
    # general utilities
    "PyYAML",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "requests",
    "networkx<3.0",            # GraphRicciCurvature 0.5.x expects networkx <3
    "GraphRicciCurvature==0.5.3.2",
    "deeprobust>=0.2.9",
]
