[project]
name = "clove_sub"
version = "0.1.0"
description = "Refactored CLoVe-Sub continual-learning experiments"
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}
authors = [
    { name = "Researcher", email = "researcher@example.com" },
]

# ---------------------------------------------------------------------------
#  Dependencies – constrained to avoid unintended heavyweight CUDA 12 wheels.
# ---------------------------------------------------------------------------
dependencies = [
    "torch>=2.1,<2.2",
    "torchvision>=0.16,<0.17",
    "timm>=0.9,<0.11",
    "torchmetrics>=1.3,<2.0",
    "numpy>=1.23,<1.28",
    "pandas>=2.0,<2.3",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"