[project]
name = "clove_sub"
version = "0.2.0"
requires-python = ">=3.10,<3.12"

dependencies = [
  "torch>=2.1.0,<2.3.0",
  "torchvision>=0.16.0,<0.18.0",
  "timm>=0.9.5,<1.2.0",
  # Geoopt 0.5.x provides all functionalities we rely on (Stiefel manifold,
  # ManifoldParameter, etc.) and has pre-built wheels for both CPU and CUDA on
  # Python 3.11.  Version ≥0.6 is currently not available for the target
  # environment which broke dependency resolution, so we pin to the latest 0.5
  # release instead.
  "geoopt>=0.5.0,<0.6.0",
  "numpy>=1.26,<2.4",
  "pandas>=2.1,<2.4",
  "matplotlib",
  "PyYAML",
  "torchmetrics>=1.3,<1.9",
  "pynvml>=11.5,<13.0",
  # Fix: use the correct package name ("pytorch-optimizer") – version 3.x is
  # provided under this name on PyPI, whereas the legacy "torch-optimizer"
  # package only goes up to 0.3.x and caused dependency resolution failure.
  "pytorch-optimizer>=3.0.0,<4.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
