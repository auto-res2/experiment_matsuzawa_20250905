[project]
name = "gcid"
version = "0.1.0"
description = "GCID – Generative Causal Interventions with Diffusion"
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    "torch",
    "torchvision",
    "wilds",
    "timm",
    # switched to CPU build due to lack of GPU wheels for Python 3.11
    "faiss-cpu>=1.7.4",
    "torchcam",
    "diffusers",
    "transformers",
    "matplotlib",
    "seaborn",
    "PyYAML",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"