[project]
name = "cgsi-experiment"
version = "0.1.0"
authors = [{name = "ML Researcher"}]
description = "Refactored CGSI robustness experiments"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=0.6.13",
    "torchmetrics>=0.11",
    "scikit-learn>=1.3",
    "huggingface_hub>=0.16",
    "tqdm>=4.66",
    "pillow>=10.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
