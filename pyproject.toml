[project]
name = "dfbd_project"
version = "0.1.0"
description = "Refactored Dynamic Few-Bit Distillation research code-base"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"

[project.dependencies]
torch = ">=2.1.0,<2.2.0"
torchvision = ">=0.18.0,<0.19.0"
numpy = "*"
matplotlib = "*"
pyyaml = "*"
tqdm = "*"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
