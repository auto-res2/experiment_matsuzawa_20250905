[project]
name = "curvonet-research"
version = "0.1.0"
description = "Research code for curvature-aware variance-preserving GNN (CURVONet)"
authors = [
    { name = "Auto-generated by ChatGPT-4" }
]
readme = "README.md"
requires-python = ">=3.10"

# -------------------------------------------------------------------------------------------------
# Dependencies                                                                                     
# -------------------------------------------------------------------------------------------------
# NOTE: The torch + CUDA wheel will be resolved automatically for the platform (Tesla T4 · CUDA 11.8)
#       Torch-Geometric and its compiled extensions are pinned with the wildcard here – the CI
#       environment installs the correct binary wheels via the PyG extra index.                     
# -------------------------------------------------------------------------------------------------
[project.dependencies]
python = "~=3.10"
torch = "^2.1"
torch-geometric = "*"
numpy = "*"
matplotlib = "*"
scikit-learn = "*"
pyyaml = "*"

# Optional/extra dependencies ---------------------------------------------------------------------
# fvcore is needed only for FLOP counting; ogb is required for the ogbn-arxiv dataset loader.       
# They are declared as optional so that the core installation does not fail when CUDA is absent.    
# -------------------------------------------------------------------------------------------------
[project.optional-dependencies]
flops = ["fvcore"]
ogb   = ["ogb"]

# -------------------------------------------------------------------------------------------------
# Poetry section kept for backward compatibility (ignored by PEP-621 installers like `uv`)          
# -------------------------------------------------------------------------------------------------
[tool.poetry]
name = "curvonet-research"
version = "0.1.0"
description = "Research code for curvature-aware variance-preserving GNN (CURVONet)"
authors = ["Auto-generated by ChatGPT-4"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
torch = "^2.1"
torch-geometric = "*"
numpy = "*"
matplotlib = "*"
scikit-learn = "*"
fvcore = { version = "*", optional = true }
pyyaml = "*"
ogb = { version = "*", optional = true }

[tool.poetry.extras]
flops = ["fvcore"]
ogb = ["ogb"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"