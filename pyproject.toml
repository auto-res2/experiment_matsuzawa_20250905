[project]
name = "clove_sub"
version = "0.1.0"
description = "Refactored CLoVe-Sub continual-learning experiments"
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}
authors = [
    { name = "Researcher", email = "researcher@example.com" },
]

# ---------------------------------------------------------------------------
#  Dependencies – ordered so that heavyweight libraries (torch) are installed
#  first and avoid possible circular resolution issues.
# ---------------------------------------------------------------------------
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=0.9.12",
    "torchmetrics>=1.2.0",
    "numpy>=1.23",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"