[tool.poetry]
name = "curvonet-research"
version = "0.1.0"
description = "Research code for curvature-aware variance-preserving GNN (CURVONet)"
authors = ["Auto-generated by ChatGPT-4"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
torch = "^2.1"
torch-geometric = "*"
numpy = "*"
matplotlib = "*"
scikit-learn = "*"
fvcore = {version = "*", optional = true}
pyyaml = "*"
ogb = {version = "*", optional = true}

[tool.poetry.extras]
flops = ["fvcore"]
ogb = ["ogb"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
