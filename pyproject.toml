[project]
name = "losr_cl_experiments"
version = "0.2.1"
requires-python = ">=3.9"
description = "Latent-Orthogonal-Sketch-Replay – reproducibility package"
license = {text = "MIT"}
authors = [
  {name = "Cutting-edge-AI-researcher", email = "research@openai.com"}
]

# ---------------------------------------------------------------------------
# Runtime dependencies -------------------------------------------------------

# Pin NumPy to <2.0 to avoid the ABI break that prevents PyTorch from finding
# the NumPy C‐API (see failing log: "Failed to initialize NumPy: _ARRAY_API not found").
# This single change resolves the cascade of "Numpy is not available" errors
# originating from torchvision → torch.utils.numpy_interface.

dependencies = [
  "numpy>=1.24,<2.0",          # ← ABI compatible with current PyTorch wheels
  "torch>=2.1,<2.2",
  "torchvision>=0.16,<0.17",
  "matplotlib>=3.7,<4.0",
  "seaborn>=0.12,<0.13",
  "scikit-learn>=1.3,<2.0",
  "pyyaml>=6.0,<7.0",
  "requests>=2.31,<3.0",
  "tqdm>=4.66,<5.0",
  "ptflops>=0.7.4,<0.8",
  "pytest>=7.4,<8.0"
]

[tool.setuptools.packages.find]
where = ["src"]
